<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarang - Discord Music Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent: #45f3ff;
            --text-main: #ffffff;
            --text-muted: #8b8c91;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1b26 0%, #0b0c10 100%);
        }
        .hero {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(90deg, #45f3ff, #6264ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            background: rgba(88, 101, 242, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.3);
            cursor: pointer;
        }
        .login-btn:hover {
            transform: translateY(-3px);
            background: rgba(88, 101, 242, 1);
            box-shadow: 0 15px 40px rgba(88, 101, 242, 0.5);
        }
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .shape {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
        }
        .shape-1 {
            width: 400px; height: 400px;
            background: #45f3ff;
            top: -100px; left: -100px;
            animation: float 10s infinite alternate;
        }
        .shape-2 {
            width: 500px; height: 500px;
            background: #6264ff;
            bottom: -200px; right: -100px;
            animation: float 15s infinite alternate-reverse;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    <div class="hero">
        <h1>Tarang</h1>
        <p>The Ultimate Audio Experience for Discord</p>
        <a href="/auth/discord" class="login-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.229 4.96C17.781 4.29 16.22 3.82 14.58 3.55C14.38 3.91 14.15 4.39 13.99 4.77C12.24 4.51 10.51 4.51 8.81 4.77C8.65 4.39 8.42 3.91 8.21 3.55C6.56 3.82 5.01 4.29 3.56 4.96C0.63 9.38 -0.3 13.68 0.08 17.91C2.01 19.34 3.87 20.2 5.69 20.76C6.14 20.15 6.55 19.5 6.91 18.81C6.25 18.57 5.63 18.27 5.04 17.91C5.2 17.79 5.35 17.67 5.5 17.54C9.17 19.24 13.06 19.24 16.69 17.54C16.85 17.67 17 17.79 17.16 17.91C16.57 18.27 15.95 18.57 15.28 18.81C15.64 19.5 16.05 20.15 16.5 20.76C18.33 20.2 20.19 19.34 22.12 17.91C22.56 12.92 21.05 8.71 19.229 4.96ZM8.52 14.96C7.39 14.96 6.46 13.92 6.46 12.65C6.46 11.38 7.37 10.34 8.52 10.34C9.68 10.34 10.61 11.38 10.58 12.65C10.58 13.92 9.68 14.96 8.52 14.96ZM14.28 14.96C13.15 14.96 12.22 13.92 12.22 12.65C12.22 11.38 13.13 10.34 14.28 10.34C15.44 10.34 16.37 11.38 16.34 12.65C16.34 13.92 15.44 14.96 14.28 14.96Z"/>
            </svg>
            Login with Discord
        </a>
    </div>
</body>
</html>
